name: Refresh profile news

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-news.yml'
      - 'scripts/updateNews.py'
      - 'newsSources.json'

permissions:
  contents: write

concurrency:
  group: profile-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Refresh headline links
        run: python3 scripts/updateNews.py
      - name: Publish changed headlines
        run: |
          if git diff --quiet -- README.md newsCache.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md newsCache.json
          git commit -m 'Refresh profile headlines'
          git push
